# Central zizmor policy for GitHub Actions workflows and composite actions.
# Discovered automatically when scanning paths under .github/.
# See https://docs.zizmor.sh/configuration/
rules:
  # Why: publishing to PyPI/TestPyPI here still relies on API tokens, so zizmor's
  #      trusted-publishing recommendation is not actionable yet.
  # Remove when: the publish workflows have been migrated to OIDC trusted publishing.
  use-trusted-publishing:
    disable: true
